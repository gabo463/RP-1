CONTRACT_TYPE
{
    name = FirstCrewedTitaniaOrbit
    title = First Crewed Titania Orbit
    group = CrewedUranusExp
    agent = Flag Planting

    description = <b>Program: Crewed Uranus System Exploration<br>Type: <color=green>Required</color></b><br><br>Titania is Uranus's largest moon and one of the most scientifically intriguing worlds in the outer Solar System. Orbiting far from the Sun in the faint light of the ice giant, this ancient, canyon-scarred world demands precise navigation and endurance from crew and spacecraft alike.<br><br>Design, launch, and fly a mission capable of carrying at least four astronauts into a stable orbit around Titania. Maintain orbital operations for 20 days to conduct reconnaissance and mapping before returning the crew safely to Earth.
    synopsis = Fly four crew members to Titania, establish a 20-day orbit, and return safely home.
    completedMessage = Congratulations! Humanity has achieved its first crewed orbit around Titania! The orbital research and surface mapping conducted by our crew will pave the way for an eventual landing attempt.

    sortKey = 22804

    cancellable = true
    declinable = false
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0

    targetBody = Titania

    // ************ REWARDS ************
    prestige = Significant      
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 8000
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedUranusExp
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = VesselGroup
        type = VesselParameterGroup
        title = First Crewed Orbit of Titania
        define = CrewedTitaniaOrbit

        PARAMETER
        {
            name = HasCrew
            type = HasCrew
            minCrew = 4
            crewOnly = true
            title = Have at least 4 crew members on board
            hideChildren = true
        }

        PARAMETER
        {
            name = TitaniaOrbit
            type = Orbit
            targetBody = Titania
            maxPeA = 400000  // 400 km Periapsis
            maxApA = 600000  // 600 km Apoapsis
            title = Reach orbit of Titania with a maximum periapsis  of 400 km and a maximum apoapsis of 600 km and hold it for at least 20 days
            disableOnStateChange = true
            completeInSequence = true

            PARAMETER
            {
                name = Duration
                type = Duration
                duration = 20d
                preWaitText = Achieve designated orbit around Titania.
                waitingText = Maintaining Titania orbit...
                completionText = Orbital operations complete!
            }
        }
    }
}