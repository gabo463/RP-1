CONTRACT_TYPE
{
    name = TitanCrewedAtmosphericStudy
    title = Crewed Atmospheric Study of Titan
    group = CrewedSaturnExp
    agent = Exploration
    

    description = <b>Program: Crewed Saturn System Exploration<br>Type: <color=green>Optional</color></b><br><br> Titan's massive nitrogen atmosphere and organic hydrocarbon haze present one of the most compelling scientific targets in the solar system. Send a crewed exploration vessel into Titan's atmosphere and perform crucial atmospheric flight research.
    synopsis = Fly a crewed vessel into Titan dense atmosphere and execute atmospheric science operations.
    completedMessage = Incredible achievement! Our crew successfully plunged into the hazy skies of Titan, gathered priceless atmospheric data!!
    
    sortKey = 2534

    cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Titan
// ************ REWARDS ************
    prestige = Trivial       
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 8000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

    // ************ REQUIREMENTS ************
   REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedSaturnExp
	}
    REQUIREMENT
    {
        name = CompleteIapetusLanding
        type = CompleteContract
        contract = FirstCrewedTitanLanding 
    }

    // ************ PARAMETERS ************

    PARAMETER
    {
        name = TitanAtmosphereGroup
        type = VesselParameterGroup
        title = Conduct crewed atmospheric operations inside Titan atmosphere

        PARAMETER
        {
            name = HasCrew
            type = HasCrew
            minCrew = 2
            title = Have at least 2 crew members on board
        }

        PARAMETER
        {
            name = EnterTitanAtmosphere
            type = ReachState
            targetBody = Titan
            situation = FLYING
            maxAltitude = 120000 
            title = Enter Titan atmosphere below 120 km
        }

        PARAMETER
        {
            name = AtmosphericFlightDuration
            type = Duration
            duration = 4h
            title = Maintain atmospheric flight inside Titan  atmosphere for at least 1 hour
        }
        PARAMETER
        {
            name = TitanAtmosphericScience
            type = CollectScience
            targetBody = Titan
            situation = FlyingHigh
            situation = FlyingLow
            recoveryMethod = RecoverOrTransmit
            title = Collect and transmit or recover atmospheric science data from Titan
        }
